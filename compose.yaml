services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: food_delivery
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit:v1.30
    ports:
      - '127.0.0.1:11025:1025'
      - '127.0.0.1:18025:8025'
  postgres-test:
    image: postgres:18
    profiles: [test]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: food_delivery_test
    ports:
      - '127.0.0.1:15432:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d food_delivery_test']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
